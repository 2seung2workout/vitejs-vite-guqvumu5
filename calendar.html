<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2seung2workout - 달력</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .goal-card {
      background: linear-gradient(135deg, #fff8f5 0%, #fff0eb 100%);
      border: 1px solid #fcded6;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .goal-tag {
      font-size: 0.75rem;
      font-weight: 700;
      background: #e06d53;
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .goal-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: #38312c;
      margin-bottom: 8px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #fae4dc;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .progress-bar-fill {
      width: 75%;
      height: 100%;
      background: #e06d53;
      border-radius: 4px;
    }
    .goal-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #8c7b74;
    }

    .calendar-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #f2eee8;
      padding: 16px;
      margin-bottom: 18px;
    }
    .calendar-month-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .month-nav-btn {
      cursor: pointer;
      background: none;
      border: none;
      font-size: 1.2rem;
      font-weight: 700;
      color: #554f49;
      padding: 4px 10px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }
    .cal-header-day {
      font-size: 0.78rem;
      font-weight: 600;
      color: #a3988f;
      padding-bottom: 8px;
    }
    .cal-cell {
      height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #403a35;
      cursor: pointer;
      position: relative;
    }
    .cal-cell.empty {
      cursor: default;
      color: #d0c8c0;
    }
    .cal-cell.selected {
      background-color: #fcefe9;
      border: 1.5px solid #e06d53;
      color: #e06d53;
    }
    .dot-badge {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: #e06d53;
      margin-top: 3px;
    }

    .daily-card-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #453e37;
    }
    .record-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f8f4ee;
    }
    .record-item:last-child { border-bottom: none; }
    .record-type-pill {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      background: #fae4dc;
      color: #c95137;
      white-space: nowrap;
    }
    .record-body h4 {
      font-size: 0.92rem;
      font-weight: 700;
      color: #2d2926;
      margin-bottom: 3px;
    }
    .record-body p {
      font-size: 0.82rem;
      color: #7d736b;
      line-height: 1.4;
    }
    .loading-notice {
      text-align: center;
      padding: 20px;
      color: #8c827a;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1>2seung2workout</h1>
      <a href="goals.html" class="header-link">목표 설정</a>
    </header>

    <div class="content-area">
      <!-- 상단 목표 배너 -->
      <div class="goal-card">
        <div class="goal-header">
          <span class="goal-tag">단기 목표</span>
          <span id="goalDays">진행 중</span>
        </div>
        <div class="goal-title">2달 동안 주 4일 30분 조깅 🏃</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill"></div>
        </div>
        <div class="goal-stats">
          <span>이번 주 루틴 달성 중</span>
          <span style="font-weight: 700; color: #e06d53;">달성 진행중</span>
        </div>
      </div>

      <!-- 월간 달력 -->
      <div class="calendar-card">
        <div class="calendar-month-bar">
          <button type="button" class="month-nav-btn" onclick="changeMonth(-1)">&lt;</button>
          <span id="calendarTitle">월간 달력</span>
          <button type="button" class="month-nav-btn" onclick="changeMonth(1)">&gt;</button>
        </div>
        <div class="cal-grid" id="calendarDays">
          <!-- 스크립트로 날짜 생성 -->
        </div>
      </div>

      <!-- 선택된 날짜 운동 목록 -->
      <div class="card">
        <div class="daily-card-title" id="selectedDateTitle">운동 기록</div>
        <div id="recordList">
          <div class="loading-notice">시트에서 운동 기록을 불러오는 중입니다...</div>
        </div>
      </div>
    </div>

    <!-- 작성 화면으로 이동 -->
    <a href="write.html" class="fab-btn" title="운동 기록하기">+</a>
  </div>

  <script>
    // 변경된 신규 웹 앱 배포 주소
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKwazikG8IOsk2tcSBYErfY1IiEmKAfqsC0ftHxqL6LfFtTp9FCslz-D-RcGWx4Tyh/exec";

    let currentDate = new Date();
    let selectedDateStr = formatDateKey(currentDate);
    let allRecords = [];

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = ("0" + (dateObj.getMonth() + 1)).slice(-2);
      const d = ("0" + dateObj.getDate()).slice(-2);
      return `${y}-${m}-${d}`;
    }

    // 구글 시트에서 전체 기록 가져오기 (GET)
    async function loadRecords() {
      try {
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();
        if (result.status === "success") {
          allRecords = result.data || [];
          renderCalendar();
          renderDailyRecords(selectedDateStr);
        } else {
          document.getElementById("recordList").innerHTML = '<div class="loading-notice">기록을 불러오지 못했습니다.</div>';
        }
      } catch (err) {
        console.error(err);
        document.getElementById("recordList").innerHTML = '<div class="loading-notice">데이터를 불러오는 중 오류가 발생했습니다.</div>';
      }
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById("calendarTitle").innerText = `${year}년 ${month + 1}월`;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDay = new Date(year, month + 1, 0).getDate();

      const daysContainer = document.getElementById("calendarDays");
      daysContainer.innerHTML = "";

      const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
      dayNames.forEach((name, idx) => {
        const col = document.createElement("div");
        col.className = "cal-header-day";
        if (idx === 0) col.style.color = "#d9534f";
        if (idx === 6) col.style.color = "#4a90e2";
        col.innerText = name;
        daysContainer.appendChild(col);
      });

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "cal-cell empty";
        daysContainer.appendChild(emptyCell);
      }

      for (let day = 1; day <= lastDay; day++) {
        const cell = document.createElement("div");
        cell.className = "cal-cell";
        cell.innerText = day;

        const cellDateStr = `${year}-${("0" + (month + 1)).slice(-2)}-${("0" + day).slice(-2)}`;

        if (cellDateStr === selectedDateStr) {
          cell.classList.add("selected");
        }

        const hasRecord = allRecords.some(r => r.date === cellDateStr);
        if (hasRecord) {
          const dot = document.createElement("div");
          dot.className = "dot-badge";
          cell.appendChild(dot);
        }

        cell.onclick = () => {
          selectedDateStr = cellDateStr;
          renderCalendar();
          renderDailyRecords(cellDateStr);
        };

        daysContainer.appendChild(cell);
      }
    }

    function renderDailyRecords(dateStr) {
      document.getElementById("selectedDateTitle").innerText = `${dateStr} 운동 기록`;
      const filtered = allRecords.filter(r => r.date === dateStr);
      const container = document.getElementById("recordList");

      if (filtered.length === 0) {
        container.innerHTML = '<div class="loading-notice" style="padding: 16px 0;">이 날짜에 작성된 운동 기록이 없습니다.</div>';
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="record-item">
          <div class="record-type-pill">${item.type || '운동'}</div>
          <div class="record-body">
            <h4>${item.duration || '시간 미지정'}</h4>
            <p>${item.content ? item.content.replace(/\n/g, '<br>') : '기록된 메모가 없습니다.'}</p>
          </div>
        </div>
      `).join("");
    }

    function changeMonth(diff) {
      currentDate.setMonth(currentDate.getMonth() + diff);
      renderCalendar();
    }

    loadRecords();
  </script>

</body>
</html>
