<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2seung2workout - 기록 작성</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1>2seung2workout</h1>
      <a href="calendar.html" class="header-link">취소</a>
    </header>

    <div class="content-area">
      <!-- 1. 운동 날짜 선택 -->
      <div class="form-group">
        <label class="form-label">운동 날짜 선택</label>
        <input type="date" id="workoutDateInput" class="input-text">
      </div>

      <!-- 2. 운동 종류 (단추형) -->
      <div class="form-group">
        <label class="form-label">운동 종류</label>
        <div class="chip-group" id="typeGroup">
          <button type="button" class="chip-btn active" onclick="selectType(this, '웨이트')">웨이트</button>
          <button type="button" class="chip-btn" onclick="selectType(this, '유산소')">유산소</button>
          <button type="button" class="chip-btn" onclick="selectType(this, '수영')">수영</button>
          <button type="button" class="chip-btn" onclick="selectType(this, '러닝')">러닝</button>
          <button type="button" class="chip-btn" onclick="selectType(this, '크로스핏')">크로스핏</button>
          <button type="button" class="chip-btn" onclick="selectType(this, '등산')">등산</button>
        </div>
      </div>

      <!-- 3. 운동 시간 (30분 단위 단추) -->
      <div class="form-group">
        <label class="form-label">운동 시간</label>
        <div class="chip-group" id="durationGroup">
          <button type="button" class="chip-btn" onclick="selectDuration(this, '30분')">30분</button>
          <button type="button" class="chip-btn active" onclick="selectDuration(this, '1시간')">1시간</button>
          <button type="button" class="chip-btn" onclick="selectDuration(this, '1시간 30분')">1시간 30분</button>
          <button type="button" class="chip-btn" onclick="selectDuration(this, '2시간')">2시간</button>
          <button type="button" class="chip-btn" onclick="selectDuration(this, '2시간 30분 이상')">2시간 30분 이상</button>
        </div>
      </div>

      <!-- 4. 세부 내용 -->
      <div class="form-group">
        <label class="form-label">운동 내용 / 메모</label>
        <textarea id="memoInput" class="input-textarea" placeholder="루틴, 중량/세트, 오늘 몸 상태를 자유롭게 적어보세요."></textarea>
      </div>

      <!-- 저장 버튼 -->
      <button type="button" class="btn-primary" id="saveBtn" onclick="saveRecord()">스프레드시트에 저장하기</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5BT5Ib11Ah0wLYxfiaBRYZ6UDzmSeUHXSDl7as0WpvAzZ0GH6mCBoseUakhfMFU-6/exec";

    let selectedType = "웨이트";
    let selectedDuration = "1시간";

    window.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const paramDate = urlParams.get('date');

      if (paramDate) {
        document.getElementById("workoutDateInput").value = paramDate;
      } else {
        const today = new Date();
        const y = today.getFullYear();
        const m = ("0" + (today.getMonth() + 1)).slice(-2);
        const d = ("0" + today.getDate()).slice(-2);
        document.getElementById("workoutDateInput").value = `${y}-${m}-${d}`;
      }
    });

    function selectType(btn, val) {
      document.querySelectorAll("#typeGroup .chip-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedType = val;
    }

    function selectDuration(btn, val) {
      document.querySelectorAll("#durationGroup .chip-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedDuration = val;
    }

    async function saveRecord() {
      const workoutDate = document.getElementById("workoutDateInput").value;
      const content = document.getElementById("memoInput").value.trim();
      const saveBtn = document.getElementById("saveBtn");

      if (!workoutDate) {
        alert("운동 날짜를 선택해 주세요.");
        return;
      }

      const savedGoals = JSON.parse(localStorage.getItem("user_workout_goals")) || {
        shortTitle: "2달 동안 주 4일 30분 조깅 🏃"
      };

      saveBtn.disabled = true;
      saveBtn.innerText = "시트에 저장하는 중...";

      const payload = {
        action: "addRecord",
        date: workoutDate,
        goal: savedGoals.shortTitle,
        type: selectedType,
        duration: selectedDuration,
        content: content
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          alert(`${workoutDate} 기록이 저장되었습니다!`);
          window.location.href = "calendar.html";
        } else {
          alert("저장 실패: " + (result.message || "오류가 발생했습니다."));
          saveBtn.disabled = false;
          saveBtn.innerText = "스프레드시트에 저장하기";
        }
      } catch (err) {
        console.error(err);
        alert("네트워크 연결 중 오류가 발생했습니다.");
        saveBtn.disabled = false;
        saveBtn.innerText = "스프레드시트에 저장하기";
      }
    }
  </script>

</body>
</html>
