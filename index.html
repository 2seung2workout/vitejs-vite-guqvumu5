<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2seung2workout</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .welcome-box {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 36px;
    }
    .welcome-emoji {
      font-size: 3rem;
      margin-bottom: 12px;
      display: inline-block;
    }
    .welcome-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #2d2926;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .welcome-sub {
      font-size: 0.95rem;
      color: #8c827a;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background-color: #fee500;
      color: #191919;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      margin-bottom: 12px;
      border: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="content-area">
      <div class="welcome-box">
        <span class="welcome-emoji">💪🌱</span>
        <h2 class="welcome-title">2seung2workout</h2>
        <p class="welcome-sub">운동 직후 가볍게 남기고, 꾸준함을 모아봐요</p>
      </div>

      <div class="card">
        <div class="form-group">
          <label class="form-label">이메일 계정</label>
          <input type="email" class="input-text" placeholder="sample@email.com" value="workout_lover@gmail.com">
        </div>
        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label">비밀번호</label>
          <input type="password" class="input-text" placeholder="비밀번호 입력" value="••••••••">
        </div>
        <a href="calendar.html" class="btn-primary">로그인하기</a>
      </div>

      <a href="calendar.html" class="social-btn">카카오로 바로 시작하기</a>
      <a href="calendar.html" class="btn-secondary">로그인 없이 달력 둘러보기</a>
    </div>
  </div>

</body>
</html>
