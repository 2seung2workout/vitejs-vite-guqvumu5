<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2seung2workout - 로그인</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .welcome-box {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 30px;
    }
    .welcome-emoji {
      font-size: 3rem;
      margin-bottom: 12px;
      display: inline-block;
    }
    .welcome-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #2d2926;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .welcome-sub {
      font-size: 0.95rem;
      color: #8c827a;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="content-area">
      <div class="welcome-box">
        <span class="welcome-emoji">💪🌱</span>
        <h2 class="welcome-title">2seung2workout</h2>
        <p class="welcome-sub">운동 직후 가볍게 남기고, 꾸준함을 모아봐요</p>
      </div>

      <div class="card">
        <div class="form-group">
          <label class="form-label">아이디 (이메일)</label>
          <input type="email" id="loginEmail" class="input-text" placeholder="sample@email.com">
        </div>
        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label">비밀번호</label>
          <input type="password" id="loginPassword" class="input-text" placeholder="비밀번호 입력">
        </div>
        <button type="button" class="btn-primary" id="loginBtn" onclick="handleLogin()">로그인하기</button>
      </div>

      <!-- 회원가입 페이지 이동 버튼 -->
      <a href="signup.html" class="btn-secondary" style="background:#fae4dc; color:#e06d53; font-weight:700;">처음이신가요? 30초 회원가입</a>
      <a href="calendar.html" class="btn-secondary">로그인 없이 달력 둘러보기</a>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5BT5Ib11Ah0wLYxfiaBRYZ6UDzmSeUHXSDl7as0WpvAzZ0GH6mCBoseUakhfMFU-6/exec";

    async function handleLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      const loginBtn = document.getElementById("loginBtn");

      if (!email || !password) {
        alert("이메일과 비밀번호를 모두 입력해 주세요.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerText = "로그인 확인 중...";

      const payload = {
        action: "login",
        email: email,
        password: password
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          localStorage.setItem("logged_in_user", JSON.stringify(result.user));
          window.location.href = "calendar.html";
        } else {
          alert("로그인 실패: " + (result.message || "아이디 또는 비밀번호가 일치하지 않습니다."));
          loginBtn.disabled = false;
          loginBtn.innerText = "로그인하기";
        }
      } catch (err) {
        console.error(err);
        alert("네트워크 통신 중 오류가 발생했습니다.");
        loginBtn.disabled = false;
        loginBtn.innerText = "로그인하기";
      }
    }
  </script>

</body>
</html>
