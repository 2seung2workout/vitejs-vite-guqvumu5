<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2seung2workout - 목표 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1>2seung2workout</h1>
      <a href="calendar.html" class="header-link">달력으로</a>
    </header>

    <div class="content-area">
      <!-- 단기 목표 설정 -->
      <div class="card">
        <div class="form-group">
          <label class="form-label">단기 목표 (1~2달 집중)</label>
          <input type="text" class="input-text" value="2달 동안 주 4일 30분 조깅">
        </div>

        <div class="form-group">
          <label class="form-label">주간 목표 횟수</label>
          <div class="chip-group">
            <button type="button" class="chip-btn">주 2일</button>
            <button type="button" class="chip-btn">주 3일</button>
            <button type="button" class="chip-btn active">주 4일</button>
            <button type="button" class="chip-btn">주 5일</button>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">목표 종료일</label>
          <input type="date" class="input-text" value="2026-10-31">
        </div>
      </div>

      <!-- 장기 목표 설정 -->
      <div class="card">
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">장기 목표 (연간 / 최종 지향)</label>
          <textarea class="input-textarea" style="min-height: 80px;" placeholder="예: 체지방률 5% 감량하기, 10km 마라톤 완주하기">올해 하반기 10km 마라톤 대회 완주 및 주 4회 꾸준한 운동 습관 유지하기</textarea>
        </div>
      </div>

      <!-- 저장 버튼 -->
      <a href="calendar.html" class="btn-primary">목표 저장하고 달력 보기</a>
    </div>
  </div>

</body>
</html>
